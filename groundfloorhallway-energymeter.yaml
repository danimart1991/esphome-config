substitutions:
  name: "groundfloorhallway-energymeter"
  comment: "Ground Floor Hallway - Energy Meter (NodeMCU ESP32S)"
  default_update_interval: 60s

<<: !include boards/nodemcu-32s.yaml
<<: !include components/api.yaml
<<: !include components/bluetooth_proxy.yaml
<<: !include components/captive_portal.yaml
<<: !include components/logger.yaml
<<: !include components/ota/esphome.yaml
<<: !include components/safe_mode.yaml
<<: !include components/time/homeassistant.yaml
<<: !include components/web_server.yaml
<<: !include components/wifi.yaml

uart:
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
  #stop_bits: 2

text_sensor:
  - <<: !include components/text_sensor/version.yaml
  - <<: !include components/text_sensor/wifi_info.yaml

sensor:
  - <<: !include components/sensor/internal_temperature.yaml
  - <<: !include components/sensor/wifi_signal.yaml
  - <<: !include components/sensor/total_daily_energy.yaml
    power_id: power_id
  - platform: pzemac
    id: pzemac_01
    current:
      name: "${name}_current"
    voltage:
      name: "${name}_voltage"
    energy:
      name: "${name}_energy"
    power:
      id: power_id
      name: "${name}_power"
    frequency:
      name: "${name}_frequency"
    power_factor:
      name: "${name}_powerfactor"
    update_interval: 1s

binary_sensor:
  - <<: !include components/binary_sensor/status.yaml

button:
  - platform: template
    name: "${name}_resetenergy"
    icon: "mdi:restart"
    on_press:
      then:
        - pzemac.reset_energy: pzemac_01

status_led:
  pin:
    number: GPIO2
    ignore_strapping_warning: true
