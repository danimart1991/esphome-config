substitutions:
  name: "kitchen-fridgeplug"
  comment: "Kitchen - Fridge Plug (Plug Blitzwolf SHP2 V2.3)"
  default_update_interval: 60s

<<: !include boards/esp8285.yaml
<<: !include components/api.yaml
<<: !include components/captive_portal.yaml
<<: !include components/logger.yaml
<<: !include components/ota/esphome.yaml
<<: !include components/safe_mode.yaml
<<: !include components/time/homeassistant.yaml
<<: !include components/web_server.yaml
<<: !include components/wifi.yaml

text_sensor:
  - <<: !include components/text_sensor/version.yaml
  - <<: !include components/text_sensor/wifi_info.yaml

binary_sensor:
  - <<: !include components/binary_sensor/status.yaml
  - platform: gpio
    id: button_id
    internal: True
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: True
    on_press:
      - switch.toggle: switch_id

switch:
  - platform: gpio
    id: switch_id
    name: ${name}_switch
    restore_mode: RESTORE_DEFAULT_ON
    pin: GPIO14
    on_turn_on:
      - switch.turn_on: blue_led_id
    on_turn_off:
      - switch.turn_off: blue_led_id
  - platform: gpio
    id: blue_led_id
    internal: True
    restore_mode: RESTORE_DEFAULT_ON
    pin:
      number: GPIO01
      inverted: True

status_led:
  pin:
    number: GPIO13
    inverted: True

sensor:
  - <<: !include components/sensor/wifi_signal.yaml
  - <<: !include components/sensor/total_daily_energy.yaml
    power_id: power_id
  - platform: hlw8012
    sel_pin:
      number: GPIO12
      inverted: True
    cf_pin: GPIO04
    cf1_pin: GPIO05
    current:
      name: ${name}_current
      icon: mdi:current-ac
      unit_of_measurement: A
      filters:
        - multiply: 0.829134
    voltage:
      name: ${name}_voltage
      icon: mdi:flash-circle
      unit_of_measurement: V
      filters:
        - multiply: 0.402105
    power:
      id: power_id
      name: ${name}_power
      icon: mdi:flash-outline
      unit_of_measurement: W
      filters:
        - multiply: 0.177739
    change_mode_every: 1
    update_interval: 10s
